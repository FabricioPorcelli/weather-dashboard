<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Weather Dashboard</title>
  <meta
    name="description"
    content="Dashboard del clima con mapa interactivo, pronóstico de 5 días y búsqueda por ciudad. JavaScript vanilla y Leaflet."
  >
  <meta name="author" content="Fabricio Porcelli">
  <meta name="theme-color" content="#111111">
  <link rel="icon" href="docs/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >
  <link rel="canonical" href="https://weather.fabricioporcelli.com.ar/">

  <!-- Open Graph: cómo se ve el proyecto al compartirlo. -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Weather Dashboard">
  <meta
    property="og:description"
    content="Clima actual y pronóstico de 5 días en un mapa interactivo, con búsqueda por ciudad y tema claro/oscuro."
  >
  <meta property="og:url" content="https://weather.fabricioporcelli.com.ar/">
  <meta property="og:image" content="https://weather.fabricioporcelli.com.ar/docs/screenshot.png">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Leaflet (CDN): hoja de estilos del mapa -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  >
  <link rel="stylesheet" href="styles.css">

  <!-- Analytics: Umami self-hosted, sin cookies por defecto. -->
  <script
    defer
    src="https://umami.fabricioporcelli.com.ar/script.js"
    data-website-id="69773a3e-2afa-4f93-a897-ff06cabac838"
    data-domains="weather.fabricioporcelli.com.ar"
  ></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Saltar al contenido</a>

  <!-- Contenedor del mapa: ocupa toda la pantalla -->
  <div id="map" role="region" aria-label="Mapa para elegir una ubicación"></div>

  <!-- Panel lateral: resumen de la ubicación elegida -->
  <main class="panel" id="main-content" tabindex="-1">
    <button
      class="panel__handle"
      id="panel-handle"
      type="button"
      aria-label="Colapsar panel"
      aria-expanded="true"
      aria-controls="current-card"
    >
      <svg
        class="panel__handle-grip"
        viewBox="0 0 48 12"
        fill="none"
        aria-hidden="true"
        focusable="false"
      >
        <path
          d="M6 4.5 24 9.5 42 4.5"
          stroke="currentColor"
          stroke-width="3.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        ></path>
      </svg>
    </button>

    <div class="panel__collapsible">
      <div class="panel__collapsible-inner">
        <header class="panel__header">
          <div class="panel__brand">
        <h1 class="panel__title">Clima</h1>
        <p class="panel__tagline">Pronóstico y consejos para donde estés</p>
      </div>
      <button class="panel__theme" id="theme-toggle" type="button" aria-label="Cambiar tema">
        <!-- Iconos de sol y luna: el CSS muestra el que corresponde al tema -->
        <svg
          class="icon icon--sun"
          viewBox="0 0 24 24"
          width="16"
          height="16"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg
          class="icon icon--moon"
          viewBox="0 0 24 24"
          width="16"
          height="16"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </header>

    <!-- Búsqueda por ciudad: se geocodifica con Nominatim y se consulta por nombre -->
    <form class="search" id="search-form" autocomplete="off">
      <input
        class="search__input"
        id="search-input"
        type="search"
        name="city"
        placeholder="Buscar ciudad o pueblo"
        aria-label="Nombre de la ciudad o pueblo"
      >
      <button class="search__button" type="submit">Buscar</button>
    </form>

    <button class="locate-button" id="locate-button" type="button">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path>
      </svg>
      Usar mi ubicación
    </button>

    <p class="panel__hint" id="status" aria-live="polite">Elegí un punto en el mapa o buscá una ciudad o pueblo.</p>
    <button class="retry-button" id="retry-button" type="button" hidden>
      Reintentar
    </button>
    <p class="panel__coords" id="coords" hidden aria-hidden="true"></p>

    <!-- Estado de caché de la API: se conserva en el código, pero no se muestra. -->
        <div class="cache" id="cache-badges" hidden aria-hidden="true">
          <span class="cache__badge" id="cache-current"></span>
          <span class="cache__badge" id="cache-forecast"></span>
        </div>
      </div>
    </div>

    <!-- Tarjeta de clima actual: se muestra cuando la API responde -->
    <section class="card card--current" id="current-card" hidden>
      <div class="card__hero">
        <div class="card__hero-copy">
          <h2 class="card__location" id="current-location"></h2>
          <p class="card__conditions" id="current-conditions"></p>
        </div>
        <p class="card__temp">
          <span id="current-temp"></span><span class="card__unit">°C</span>
        </p>
      </div>
      <div class="card__extra">
        <div class="card__extra-inner">
          <dl class="card__details">
            <div>
              <dt>Sensación</dt>
              <dd id="current-feels-like"></dd>
            </div>
            <div>
              <dt>Humedad</dt>
              <dd id="current-humidity"></dd>
            </div>
            <div>
              <dt>Viento</dt>
              <dd id="current-wind"></dd>
            </div>
            <div>
              <dt>Precipitación</dt>
              <dd id="current-precip"></dd>
            </div>
          </dl>
          <p class="card__updated" id="current-updated"></p>
        </div>
      </div>
    </section>

    <div class="panel__collapsible panel__collapsible--bottom">
      <div class="panel__collapsible-inner">
        <!-- Abre el chat como ventana emergente sobre el marcador del mapa. -->
        <button class="chat-open" id="chat-open" type="button" hidden>
          Preguntar sobre este lugar
        </button>

        <!-- Pronóstico: tira de 5 días con barras de rango de temperatura -->
        <section class="card card--forecast" id="forecast-card" hidden>
          <div class="forecast-header">
            <div class="forecast-heading">
              <span class="forecast-heading__icon" aria-hidden="true">
                <svg
                  class="forecast-heading__svg"
                  id="forecast-icon-daily"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  focusable="false"
                >
                  <rect x="3" y="5" width="18" height="16" rx="3"></rect>
                  <path d="M8 3v4M16 3v4M3 10h18"></path>
                  <path d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"></path>
                </svg>
                <svg
                  class="forecast-heading__svg forecast-heading__svg--hidden"
                  id="forecast-icon-hourly"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  focusable="false"
                >
                  <circle cx="12" cy="12" r="8.5"></circle>
                  <path d="M12 7.5V12l3 2"></path>
                </svg>
              </span>
              <h2 class="card__title">Pronóstico</h2>
            </div>
            <div class="forecast-tabs" role="tablist" aria-label="Vista del pronóstico">
              <button
                class="forecast-tab"
                id="forecast-tab-daily"
                type="button"
                role="tab"
                aria-selected="true"
                aria-controls="forecast-daily-panel"
                tabindex="0"
              >
                5 días
              </button>
              <button
                class="forecast-tab"
                id="forecast-tab-hourly"
                type="button"
                role="tab"
                aria-selected="false"
                aria-controls="forecast-hourly-panel"
                tabindex="-1"
              >
                Por hora
              </button>
            </div>
          </div>

          <div
            class="forecast-panel"
            id="forecast-daily-panel"
            role="tabpanel"
            aria-labelledby="forecast-tab-daily"
          >
            <ul
              class="forecast"
              id="forecast-days"
              aria-label="Pronóstico de los próximos días"
            ></ul>
          </div>

          <div
            class="forecast-panel"
            id="forecast-hourly-panel"
            role="tabpanel"
            aria-labelledby="forecast-tab-hourly"
            hidden
          >
            <p class="hourly-status" id="hourly-status" aria-live="polite" hidden></p>
            <div class="hourly-scroll" id="hourly-days"></div>
            <div
              class="hourly-scrollbar"
              id="hourly-scrollbar"
              aria-hidden="true"
              hidden
            >
              <span class="hourly-scrollbar__thumb" id="hourly-scrollbar-thumb"></span>
            </div>
          </div>
        </section>
      </div>
    </div>

  </main>

  <p class="sr-only" id="live-status" aria-live="polite"></p>

  <!-- Capa que captura los gestos del fondo mientras el chat móvil está abierto. -->
  <div class="chat-backdrop" id="chat-backdrop" aria-hidden="true" hidden></div>

  <!-- Chat emergente: se inserta en un popup de Leaflet junto al marcador. -->
  <section class="chat-panel" id="chat-panel" hidden aria-label="Preguntas sobre el clima">
    <div class="chat__header">
      <div class="chat__identity">
        <span class="chat__avatar" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"
            ></path>
            <path d="m16.5 7 .5 1.2 1.2.5-1.2.5-.5 1.2-.5-1.2-1.2-.5 1.2-.5.5-1.2Z"></path>
          </svg>
        </span>
        <div class="chat__heading">
          <h2 class="chat__title">Pregunta sobre el clima</h2>
        </div>
      </div>
      <button class="chat__close" id="chat-close" type="button" aria-label="Cerrar chat">
        ×
      </button>
    </div>
    <p class="chat__location" id="chat-location">Sin ubicación seleccionada.</p>

    <div
      class="chat__suggestions"
      id="chat-suggestions"
      role="group"
      aria-label="Preguntas de ejemplo"
    >
      <p class="chat__suggestions-title">Probá preguntar</p>
      <div class="chat__suggestions-list">
        <button
          class="chat__suggestion"
          type="button"
          data-question="¿Llevo paraguas hoy?"
        >
          ¿Llevo paraguas hoy?
        </button>
        <button
          class="chat__suggestion"
          type="button"
          data-question="¿Qué ropa me pongo?"
        >
          ¿Qué ropa me pongo?
        </button>
        <button
          class="chat__suggestion"
          type="button"
          data-question="¿Conviene regar?"
        >
          ¿Conviene regar?
        </button>
        <button
          class="chat__suggestion"
          type="button"
          data-question="¿Cuál es el mejor día para salir?"
        >
          ¿Cuál es el mejor día para salir?
        </button>
      </div>
    </div>

    <div
      class="chat__messages"
      id="chat-messages"
      role="log"
      aria-live="polite"
      aria-label="Conversación con el asistente"
    ></div>

    <p class="chat__status" id="chat-status" hidden></p>

    <form class="chat__form" id="chat-form" autocomplete="off">
      <input
        class="chat__input"
        id="chat-input"
        type="text"
        maxlength="500"
        placeholder="Preguntá sobre el clima…"
        aria-label="Mensaje para el asistente"
        enterkeyhint="send"
      >
      <button class="chat__send" id="chat-send" type="submit">Enviar</button>
    </form>
  </section>

  <!-- Leaflet (CDN): debe cargarse antes que los módulos que usan `L`. -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
