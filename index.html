<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Dashboard</title>
  <meta
    name="description"
    content="Dashboard del clima con mapa interactivo, pronóstico de 5 días y búsqueda por ciudad. JavaScript vanilla, Leaflet y Chart.js."
  >
  <meta name="author" content="Fabricio Porcelli">
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" href="docs/favicon.svg" type="image/svg+xml">
  <link rel="canonical" href="https://github.com/FabricioPorcelli/weather-dashboard">

  <!-- Open Graph: cómo se ve el proyecto al compartirlo. Actualizar og:image
       a una URL absoluta cuando el dashboard esté publicado. -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Weather Dashboard">
  <meta
    property="og:description"
    content="Clima actual y pronóstico de 5 días en un mapa interactivo, con búsqueda por ciudad y tema claro/oscuro."
  >
  <meta property="og:url" content="https://github.com/FabricioPorcelli/weather-dashboard">
  <meta property="og:image" content="docs/screenshot.png">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Leaflet (CDN): hoja de estilos del mapa -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  >
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Contenedor del mapa: ocupa toda la pantalla -->
  <div id="map" role="application" aria-label="Mapa para elegir una ubicación"></div>

  <!-- Panel lateral: resumen de la ubicación elegida -->
  <aside class="panel">
    <header class="panel__header">
      <h1 class="panel__title">Clima</h1>
      <button class="panel__theme" id="theme-toggle" type="button" aria-label="Cambiar tema">
        <!-- Iconos de sol y luna: el CSS muestra el que corresponde al tema -->
        <svg
          class="icon icon--sun"
          viewBox="0 0 24 24"
          width="16"
          height="16"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg
          class="icon icon--moon"
          viewBox="0 0 24 24"
          width="16"
          height="16"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </header>

    <!-- Búsqueda por ciudad: se geocodifica con Nominatim y se consulta por nombre -->
    <form class="search" id="search-form" autocomplete="off">
      <input
        class="search__input"
        id="search-input"
        type="search"
        name="city"
        placeholder="Buscar ciudad (ej. Madrid)"
        aria-label="Nombre de la ciudad"
      >
      <button class="search__button" type="submit">Buscar</button>
    </form>

    <p class="panel__hint" id="status" aria-live="polite">Hacé clic en el mapa o buscá una ciudad.</p>
    <p class="panel__coords" id="coords"></p>

    <!-- Estado de caché de la API en la última consulta (HIT/MISS) -->
    <div class="cache" id="cache-badges" hidden>
      <span class="cache__badge" id="cache-current"></span>
      <span class="cache__badge" id="cache-forecast"></span>
    </div>

    <!-- Tarjeta de clima actual: se muestra cuando la API responde -->
    <section class="card" id="current-card" hidden>
      <h2 class="card__location" id="current-location"></h2>
      <p class="card__temp">
        <span id="current-temp"></span><span class="card__unit">°C</span>
      </p>
      <p class="card__conditions" id="current-conditions"></p>
      <dl class="card__details">
        <div>
          <dt>Sensación</dt>
          <dd id="current-feels-like"></dd>
        </div>
        <div>
          <dt>Humedad</dt>
          <dd id="current-humidity"></dd>
        </div>
        <div>
          <dt>Viento</dt>
          <dd id="current-wind"></dd>
        </div>
        <div>
          <dt>Precipitación</dt>
          <dd id="current-precip"></dd>
        </div>
      </dl>
      <p class="card__updated" id="current-updated"></p>
    </section>

    <!-- Pronóstico: gráfico de temperaturas y lista de días -->
    <section class="card" id="forecast-card" hidden>
      <h2 class="card__title">Próximos días</h2>
      <div class="chart">
        <canvas
          id="forecast-chart"
          role="img"
          aria-label="Temperaturas máximas y mínimas del pronóstico"
        ></canvas>
      </div>
      <ul class="days" id="forecast-days"></ul>
    </section>
  </aside>

  <!-- Leaflet y Chart.js (CDN): deben cargarse antes que los módulos que usan
       los globales `L` y `Chart` -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
